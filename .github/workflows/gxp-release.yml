# GxP release
#
# Called by an application repository on every push to its stage branch, i.e. when a pull request
# from develop is merged. One run takes the candidate all the way: intake (which approved change
# requests it contains and which version it becomes), unit tests, a single image build, (simulated)
# STAGING with automated checks, evidence, a verification gate, a production approval gate,
# promotion of the same image to (simulated) PRODUCTION, and the release: the production branch
# moves to the released commit, tag vX.Y.Z, GitHub release with the PDF report, change requests closed.
#
# The application repository needs environments gxp-verification and gxp-production with
# required reviewers (gxp-production with "Prevent self-review").
#
# The caller must grant: contents: write, packages: write, pull-requests: read, issues: write,
# deployments: read, id-token: write, actions: write.

name: GxP release

on:
  workflow_call:
    inputs:
      stage-branch:
        description: Branch that holds what is validated in STAGING. Releases start from pushes to it.
        type: string
        default: stage
      production-branch:
        description: Branch that holds what runs in PRODUCTION. Only this workflow moves it.
        type: string
        default: main
      node-version:
        description: Node.js version used to run the unit tests.
        type: string
        default: '22'
      install-command:
        description: Command that installs dependencies. Empty to skip.
        type: string
        default: npm ci
      test-command:
        description: Command that runs the unit tests and writes JUnit XML into test-results-path.
        type: string
        default: npm test
      test-results-path:
        description: Folder with JUnit XML test results.
        type: string
        default: test-results
      dockerfile:
        type: string
        default: Dockerfile
      build-context:
        type: string
        default: .
      container-port:
        description: Port the application listens on inside the container.
        type: number
        default: 8080
      staging-config:
        description: Non-secret STAGING configuration (env file).
        type: string
        default: deploy/staging.env
      production-config:
        description: Non-secret PRODUCTION configuration (env file). Hashed into the release record.
        type: string
        default: deploy/production.env
      ui-expected-text:
        description: Text the home page must contain. Empty to skip the check.
        type: string
        default: ''

jobs:
  intake:
    name: 1 · Release intake
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      label: ${{ steps.decide.outputs.label }}
      code-authors: ${{ steps.decide.outputs.code_authors }}
      commit: ${{ steps.candidate.outputs.commit }}
      image: ${{ steps.candidate.outputs.image }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the framework version
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The calling workflow must grant 'id-token: write' so the framework can identify its own version."
            exit 1
          fi
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=gxp-framework-identity" | jq -r '.value')
          echo "::add-mask::${token}"
          payload=$(cut -d. -f2 <<<"${token}" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims=$(base64 -d <<<"${payload}")
          ref=$(jq -r '.job_workflow_ref' <<<"${claims}")
          sha=$(jq -r '.job_workflow_sha' <<<"${claims}")
          version="${ref##*@refs/tags/}"
          if [[ "${ref}" != *"@refs/tags/"* ]] || ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The GxP framework must be referenced by a version tag (for example @v1.2.0), not '@${ref##*@}'."
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
            echo "::warning::Framework ${version} is a pre-release and must not be used for GxP production releases."
          fi
          mkdir -p "${RUNNER_TEMP}/gxp-intake"
          jq -n --arg version "${version}" --arg ref "${ref}" --arg sha "${sha}" --argjson prerelease "${prerelease}" \
            '{version: $version, workflow_ref: $ref, workflow_sha: $sha, prerelease: $prerelease}' \
            > "${RUNNER_TEMP}/gxp-intake/framework.json"
          echo "Framework: ${ref} (${sha})"

      - name: Collect the candidate
        id: candidate
        env:
          STAGE: ${{ inputs.stage-branch }}
          PRODUCTION: ${{ inputs.production-branch }}
          DIR: ${{ runner.temp }}/gxp-intake
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${STAGE}" ]; then
            echo "::error::A release starts from a push to ${STAGE} (a merged pull request), not from ${GITHUB_REF}."
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git rev-parse -q --verify "refs/remotes/origin/${PRODUCTION}" >/dev/null; then
            echo "::error::The ${PRODUCTION} branch does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "origin/${PRODUCTION}" "${commit}"; then
            echo "::error::${PRODUCTION} contains commits that ${STAGE} does not. ${STAGE} must contain everything in ${PRODUCTION}."
            exit 1
          fi
          if [ -z "$(git rev-list "origin/${PRODUCTION}..${commit}")" ]; then
            echo "::error::${STAGE} has no changes that are not in ${PRODUCTION} yet, so there is nothing to release."
            exit 1
          fi
          base_tag=$(git tag --merged "origin/${PRODUCTION}" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          git log --reverse --format='%H%x09%s' "origin/${PRODUCTION}..${commit}" \
            | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {sha: .[0], subject: (.[1:] | join("\t"))})' \
            > "${DIR}/commits.json"
          jq -n --arg commit "${commit}" --arg base_tag "${base_tag}" --arg stage "${STAGE}" --arg production "${PRODUCTION}" \
                --slurpfile commits "${DIR}/commits.json" \
            '{commit: $commit, base_tag: $base_tag, stage_branch: $stage, production_branch: $production, commits: $commits[0]}' \
            > "${DIR}/candidate.json"
          rm "${DIR}/commits.json"
          {
            echo "commit=${commit}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "${GITHUB_OUTPUT}"

      - name: Collect the pull requests and change requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIR: ${{ runner.temp }}/gxp-intake
          STAGE: ${{ inputs.stage-branch }}
        with:
          script: |
            // Only collects data. The rules are applied by the next step, which the framework tests cover.
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const dir = process.env.DIR;
            const stage = process.env.STAGE;
            const candidate = JSON.parse(fs.readFileSync(`${dir}/candidate.json`, 'utf8'));
            const isHuman = (login) => Boolean(login) && !login.endsWith('[bot]') && login !== 'web-flow';
            const refPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|implement(?:s|ed)?)\s*:?\s+#(\d+)/gi;

            const commits = [];
            const prNumbers = new Set();
            for (const c of candidate.commits) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: c.sha });
              const merged = data.filter((p) => p.merged_at && p.base.ref === stage).map((p) => p.number);
              merged.forEach((n) => prNumbers.add(n));
              commits.push({ ...c, pull_requests: merged });
            }

            const pullRequests = {};
            const issueNumbers = new Set();
            for (const number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
              const prCommits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
              const linked = [...new Set([...(pr.body ?? '').matchAll(refPattern)].map((m) => Number(m[1])))];
              linked.forEach((n) => issueNumbers.add(n));
              pullRequests[number] = {
                number, title: pr.title, url: pr.html_url, author: pr.user.login, merged_by: pr.merged_by?.login ?? null,
                merged_at: pr.merged_at, head_sha: pr.head.sha, base: pr.base.ref, head: pr.head.ref, linked_issues: linked,
                commit_authors: [...new Set(prCommits.map((c) => c.author?.login).filter(isHuman))],
                reviews: reviews.filter((r) => r.state !== 'PENDING').map((r) => ({
                  login: r.user.login, state: r.state, commit_id: r.commit_id, submitted_at: r.submitted_at, url: r.html_url })),
              };
            }

            const query = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issueOrPullRequest(number: $number) {
                  __typename
                  ... on Issue {
                    number title url state body createdAt lastEditedAt author { login }
                    comments(first: 100) { nodes { databaseId url body createdAt lastEditedAt author { login } } }
                  }
                }
              }
            }`;
            const issues = {};
            for (const number of issueNumbers) {
              let item = null;
              try {
                item = (await github.graphql(query, { owner, repo, number })).repository.issueOrPullRequest;
              } catch (error) {
                // A deleted or never-created issue is reported as an error, not as null.
                if (!/could not resolve/i.test(error.message)) throw error;
              }
              if (!item) { issues[number] = { type: 'missing' }; continue; }
              if (item.__typename !== 'Issue') { issues[number] = { type: item.__typename }; continue; }
              issues[number] = {
                type: 'Issue', number: item.number, title: item.title, url: item.url, state: item.state,
                requester: item.author?.login ?? null, created_at: item.createdAt, last_edited_at: item.lastEditedAt,
                body_sha256: require('node:crypto').createHash('sha256').update(item.body ?? '').digest('hex'),
                comments: item.comments.nodes.map((c) => ({
                  id: c.databaseId, url: c.url, body: c.body, author: c.author?.login ?? null,
                  created_at: c.createdAt, last_edited_at: c.lastEditedAt })),
              };
            }

            fs.writeFileSync(`${dir}/intake-data.json`, JSON.stringify({ commits, pull_requests: pullRequests, issues }, null, 2));
            core.info(`${commits.length} commit(s), ${prNumbers.size} pull request(s), ${issueNumbers.size} change request(s)`);

      - name: Decide what the release contains
        id: decide
        env:
          DIR: ${{ runner.temp }}/gxp-intake
          PRODUCTION: ${{ inputs.production-branch }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if ! git show "origin/${PRODUCTION}:.gxp/roles.yml" > "${DIR}/roles.yml" 2>/dev/null; then
            echo "::error::.gxp/roles.yml is missing on ${PRODUCTION}."
            exit 1
          fi
          yq -o=json '.' "${DIR}/roles.yml" > "${DIR}/roles.json"
          python3 - <<'PY'
          import json, os, re

          d = os.environ["DIR"]
          def load(name):
              with open(os.path.join(d, name), encoding="utf-8") as fh:
                  return json.load(fh)
          data, candidate, roles = load("intake-data.json"), load("candidate.json"), load("roles.json") or {}
          stage = candidate["stage_branch"]
          problems = []

          ROLE_NAMES = ("change_approvers", "verifiers", "release_approvers")
          if roles.get("schema") != "gxp-roles/v2":
              problems.append(".gxp/roles.yml must use schema gxp-roles/v2 with change_approvers, verifiers and release_approvers")
          role = {name: set(roles.get(name) or []) for name in ROLE_NAMES}
          for name in ROLE_NAMES:
              if not role[name]:
                  problems.append(f".gxp/roles.yml lists no {name}")

          IMPACT = ["none", "low", "medium", "high"]
          PATH = ["abbreviated", "targeted", "full"]
          TYPES = ["fix", "feature", "breaking"]

          def parse_approval(body):
              fields = {}
              for line in body.splitlines()[1:]:
                  if ":" in line:
                      key, value = line.split(":", 1)
                      fields[key.strip().lower()] = value.strip()
              for key in ("impact", "path", "type"):
                  fields[key] = fields.get(key, "").lower()
              reqs = [r for r in re.split(r"[,\s]+", fields.get("requirements", "")) if r]
              errors = []
              if fields["impact"] not in IMPACT: errors.append("impact must be none, low, medium or high")
              if fields["path"] not in PATH: errors.append("path must be abbreviated, targeted or full")
              if fields["type"] not in TYPES: errors.append("type must be fix, feature or breaking")
              if fields["impact"] != "none" and not reqs: errors.append("requirements must list the affected requirement IDs")
              if not fields.get("reason"): errors.append("reason is required")
              if fields["impact"] == "high" and fields["path"] != "full": errors.append("impact high requires path full")
              if fields["impact"] == "medium" and fields["path"] == "abbreviated": errors.append("impact medium requires path targeted or full")
              return fields, reqs, errors

          def evaluate_issue(number, issue, referenced_by):
              if issue.get("type") == "missing":
                  return None, f"#{number}, referenced by {referenced_by}, does not exist (was it deleted?)"
              if issue.get("type") != "Issue":
                  return None, f"#{number}, referenced by {referenced_by}, is not an issue"
              if issue["state"] != "OPEN":
                  return None, f"#{number} '{issue['title']}' is closed (already released or rejected)"
              requester, decision, notes = issue["requester"], None, []
              for c in issue["comments"]:  # oldest first
                  body = (c["body"] or "").strip()
                  command = body.splitlines()[0].strip().lower() if body else ""
                  if not (command.startswith("/approve") or command.startswith("/reject")):
                      continue
                  who = c["author"]
                  if who not in role["change_approvers"]:
                      notes.append(f"{who} is not a change approver"); continue
                  if who == requester:
                      notes.append(f"{who} requested the change and cannot decide on it"); continue
                  if command.startswith("/reject"):
                      decision = {"rejected_by": who}; continue
                  fields, reqs, errors = parse_approval(body)
                  if c["last_edited_at"]:
                      errors.append("the approval comment was edited after it was posted")
                  if errors:
                      notes.append(f"approval by {who}: " + "; ".join(errors)); continue
                  decision = {
                      "number": number, "title": issue["title"], "url": issue["url"], "requester": requester,
                      "type": fields["type"], "impact": fields["impact"], "path": fields["path"], "requirements": reqs,
                      "reason": fields["reason"], "change_control_id": fields.get("cc") or None,
                      "approved_by": who, "approved_at": c["created_at"], "approval_url": c["url"],
                      "request_sha256": issue["body_sha256"],
                  }
              if decision is None:
                  return None, f"#{number} '{issue['title']}' is not approved (" + ("; ".join(notes) or "no /approve comment") + ")"
              if "rejected_by" in decision:
                  return None, f"#{number} '{issue['title']}' was rejected by {decision['rejected_by']}"
              if issue["last_edited_at"] and issue["last_edited_at"] > decision["approved_at"]:
                  return None, f"#{number} '{issue['title']}': the request text was edited after it was approved; approve it again"
              return decision, None

          for c in data["commits"]:
              if not c["pull_requests"]:
                  problems.append(f"commit {c['sha'][:7]} '{c['subject']}' reached {stage} without a merged pull request")

          pull_requests, code_authors, issue_numbers = [], set(), []
          for pr in sorted(data["pull_requests"].values(), key=lambda p: p["number"]):
              authors = set(pr["commit_authors"]) | {pr["author"]}
              code_authors |= authors
              latest = {}
              for r in pr["reviews"]:  # oldest first
                  if r["state"] in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                      latest[r["login"]] = r
              # A review only counts if it was given before the merge; approving afterwards proves nothing.
              reviews = [r for r in latest.values() if r["state"] == "APPROVED" and r["commit_id"] == pr["head_sha"]
                         and r["login"] in role["change_approvers"] and r["login"] not in authors
                         and r["submitted_at"] <= pr["merged_at"]]
              if not reviews:
                  problems.append(f"PR #{pr['number']} '{pr['title']}' was merged without an approving code review of its final commit"
                                  " by a change approver who did not write the code")
              if not pr["linked_issues"]:
                  problems.append(f"PR #{pr['number']} '{pr['title']}' does not reference a change request; add 'Closes #<issue>' to its description")
              issue_numbers += [n for n in pr["linked_issues"] if n not in issue_numbers]
              pull_requests.append({
                  "number": pr["number"], "title": pr["title"], "url": pr["url"], "author": pr["author"],
                  "merged_by": pr["merged_by"], "merged_at": pr["merged_at"], "linked_issues": pr["linked_issues"],
                  "code_authors": sorted(authors),
                  "reviewed_by": [{"login": r["login"], "submitted_at": r["submitted_at"], "url": r["url"]} for r in reviews],
              })

          change_requests = []
          for number in sorted(issue_numbers):
              referenced_by = ", ".join(f"PR #{p['number']}" for p in pull_requests if number in p["linked_issues"])
              cr, problem = evaluate_issue(number, data["issues"].get(str(number), {"type": "missing"}), referenced_by)
              if problem:
                  problems.append(problem)
              else:
                  change_requests.append(cr)

          result = {"problems": problems, "pull_requests": pull_requests, "change_requests": change_requests,
                    "code_authors": sorted(code_authors), "base_tag": candidate["base_tag"] or None}
          if change_requests and not problems:
              major, minor, patch = (int(x) for x in (candidate["base_tag"] or "v0.0.0")[1:].split("."))
              bump = max((cr["type"] for cr in change_requests), key=TYPES.index)
              version = {"breaking": f"{major + 1}.0.0", "feature": f"{major}.{minor + 1}.0", "fix": f"{major}.{minor}.{patch + 1}"}[bump]
              result.update({
                  "version": version, "label": f"{version}-rc.{os.environ['RUN_NUMBER']}", "bump": bump,
                  "gxp_impact": max((cr["impact"] for cr in change_requests), key=IMPACT.index),
                  "validation_path": max((cr["path"] for cr in change_requests), key=PATH.index),
                  "impacted_requirements": sorted({r for cr in change_requests for r in cr["requirements"]}),
                  "change_control_ids": sorted({cr["change_control_id"] for cr in change_requests if cr["change_control_id"]}),
              })
          elif not problems:
              problems.append("no change requests found")
          with open(os.path.join(d, "change-requests.json"), "w", encoding="utf-8") as fh:
              json.dump(result, fh, indent=2)

          lines = ["## 1 · Release intake", ""]
          if "version" in result:
              lines += [f"**Release {result['version']}** (candidate `{result['label']}`, {result['bump']} after {result['base_tag'] or 'no earlier release'}):"
                        f" impact **{result['gxp_impact']}**, path **{result['validation_path']}**,"
                        f" requirements {', '.join(result['impacted_requirements']) or 'none'}", ""]
          lines += ["| Change request | Type | Impact / path | Approved by |", "|---|---|---|---|"]
          lines += [f"| [#{cr['number']} {cr['title']}]({cr['url']}) | {cr['type']} | {cr['impact']} / {cr['path']} | @{cr['approved_by']} |" for cr in change_requests]
          lines += ["", "| Pull request | Author | Reviewed by |", "|---|---|---|"]
          lines += [f"| [#{p['number']} {p['title']}]({p['url']}) | @{p['author']} | {', '.join('@' + r['login'] for r in p['reviewed_by']) or '-'} |" for p in pull_requests]
          if problems:
              lines += ["", *[f"- ❌ {p}" for p in problems]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          for p in problems:
              print(f"::error::{p}")
          if problems:
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={result['version']}\nlabel={result['label']}\ncode_authors={json.dumps(result['code_authors'])}\n")
          PY

      - name: Check that the version is not released yet
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Version ${VERSION} is already released (tag v${VERSION} exists)."
            exit 1
          fi

      - name: Check that the release gates are set up
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Early warning only: the gates themselves verify the recorded approvals when the run reaches them.
            const { owner, repo } = context.repo;
            const problems = [];
            for (const [name, blockSelfReview] of [['gxp-verification', false], ['gxp-production', true]]) {
              try {
                const { data } = await github.rest.repos.getEnvironment({ owner, repo, environment_name: name });
                const rule = (data.protection_rules ?? []).find((r) => r.type === 'required_reviewers');
                if (!rule) problems.push(`environment ${name} has no required reviewers`);
                else if (blockSelfReview && !rule.prevent_self_review) problems.push(`environment ${name} must have "Prevent self-review" enabled`);
                // A bypass leaves no review behind, so the gate job would fail; warn before the run gets there.
                if (data.can_admins_bypass) core.warning(`Environment ${name} lets administrators bypass its reviewers. Untick "Allow administrators to bypass configured protection rules".`);
              } catch (error) {
                if (error.status === 404) problems.push(`environment ${name} does not exist`);
                else core.warning(`Could not read environment ${name} (${error.status ?? error.message}); its approval is still checked when the run reaches it.`);
              }
            }
            if (problems.length) core.setFailed(`The release gates are not set up: ${problems.join('; ')}. See the framework README.`);

      - name: Upload intake evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-intake
          path: ${{ runner.temp }}/gxp-intake
          if-no-files-found: ignore

  unit-tests:
    name: 2 · Unit tests
    needs: intake
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        if: inputs.install-command != ''
        run: ${{ inputs.install-command }}

      - name: Run unit tests
        run: ${{ inputs.test-command }}

      - name: Summarise results and requirement coverage
        if: always()
        env:
          RESULTS: ${{ inputs.test-results-path }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          import xml.etree.ElementTree as ET

          results_dir = os.environ["RESULTS"]
          tests = []
          for path in sorted(glob.glob(os.path.join(results_dir, "**", "*.xml"), recursive=True)):
              for case in ET.parse(path).getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      status = "failed"
                  elif case.find("skipped") is not None:
                      status = "skipped"
                  else:
                      status = "passed"
                  name = case.get("name", "")
                  reqs = re.findall(r"\[([A-Z][A-Z0-9]*-\d+)\]", name)
                  tests.append({"name": name, "status": status, "requirements": reqs, "file": os.path.relpath(path)})

          totals = {s: sum(t["status"] == s for t in tests) for s in ("passed", "failed", "skipped")}
          trace = {}
          for t in tests:
              for r in t["requirements"]:
                  entry = trace.setdefault(r, {"tests": 0, "passed": 0, "failed": 0, "skipped": 0})
                  entry["tests"] += 1
                  entry[t["status"]] += 1
          summary = {
              "result": "pass" if tests and totals["failed"] == 0 else "fail",
              "total": len(tests), **totals,
              "traceability": dict(sorted(trace.items())),
              "tests": tests,
          }
          os.makedirs(results_dir, exist_ok=True)
          with open(os.path.join(results_dir, "unit-tests.json"), "w") as fh:
              json.dump(summary, fh, indent=2)

          lines = ["## 2 · Unit tests", "",
                   f"**{totals['passed']}/{len(tests)} passed**, {totals['failed']} failed, {totals['skipped']} skipped", "",
                   "| Requirement | Tests | Passed | Failed |", "|---|---|---|---|"]
          lines += [f"| {r} | {e['tests']} | {e['passed']} | {e['failed']} |" for r, e in sorted(trace.items())]
          if not trace:
              lines.append("| (no tests reference a requirement ID) | | | |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          if not tests:
              print("::error::No JUnit test results were found in " + results_dir)
              raise SystemExit(1)
          # Do not rely only on the exit code of the application's test command.
          if totals["failed"]:
              print(f"::error::{totals['failed']} unit test(s) failed")
              raise SystemExit(1)
          PY

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-unit-tests
          path: ${{ inputs.test-results-path }}
          if-no-files-found: error

  build:
    name: 3 · Build image (once)
    needs: [intake, unit-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.build.outputs.reference }}
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.commit }}
          persist-credentials: false

      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push the image
        id: build
        env:
          IMAGE: ${{ needs.intake.outputs.image }}
          TAG: ${{ needs.intake.outputs.label }}
          COMMIT: ${{ needs.intake.outputs.commit }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.build-context }}
        run: |
          set -euo pipefail
          if skopeo inspect --raw "docker://${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} was already built. Re-run only the failed jobs of the original run; a new candidate starts with the next merge to stage."
            exit 1
          fi
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          build_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          docker buildx build \
            --file "${DOCKERFILE}" \
            --build-arg "GIT_COMMIT=${COMMIT}" \
            --build-arg "BUILD_ID=${build_id}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.created=${created}" \
            --provenance=false --sbom=false \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:sha-${COMMIT}" \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --push "${CONTEXT}"

          # The digest is the image's identity from here on. Confirm the registry holds exactly it.
          registry_digest="sha256:$(skopeo inspect --raw "docker://${IMAGE}:${TAG}" | sha256sum | cut -d' ' -f1)"
          digest=$(jq -r '."containerimage.digest" // empty' "${RUNNER_TEMP}/build-metadata.json")
          digest="${digest:-${registry_digest}}"
          if [ "${digest}" != "${registry_digest}" ]; then
            echo "::error::Built digest ${digest} differs from the registry digest ${registry_digest}."
            exit 1
          fi
          reference="${IMAGE}@${digest}"
          mkdir -p "${RUNNER_TEMP}/gxp-build"
          jq -n --arg image "${IMAGE}" --arg digest "${digest}" --arg reference "${reference}" \
                --arg tag "${TAG}" --arg commit "${COMMIT}" --arg build_id "${build_id}" --arg created "${created}" \
                --arg dockerfile_sha256 "$(sha256sum "${DOCKERFILE}" | cut -d' ' -f1)" \
            '{image: $image, digest: $digest, reference: $reference, tags: [$tag, "sha-\($commit)"],
              build_id: $build_id, built_at: $created, dockerfile_sha256: $dockerfile_sha256}' \
            > "${RUNNER_TEMP}/gxp-build/build.json"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          {
            echo "## 3 · Build image (once)"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Tags | \`${TAG}\`, \`sha-${COMMIT:0:12}\` |"
            echo "| Build | \`${build_id}\` at ${created} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-build
          path: ${{ runner.temp }}/gxp-build

  staging:
    name: 4 · Staging deployment and automated checks
    needs: [intake, build]
    runs-on: ubuntu-24.04
    # Records the deployment, so the repository's Environments view shows which candidate is on staging.
    environment: gxp-staging
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.commit }}
          persist-credentials: false

      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # v0.1: STAGING is simulated by running the image on the runner. From v0.3 this step
      # deploys the same digest to Azure Container Apps.
      - name: Deploy the image to simulated staging
        env:
          REFERENCE: ${{ needs.build.outputs.reference }}
          CONFIG: ${{ inputs.staging-config }}
          PORT: ${{ inputs.container-port }}
          TAG: ${{ needs.intake.outputs.label }}
        run: |
          set -euo pipefail
          docker pull --quiet "${REFERENCE}"
          docker run --detach --name gxp-target --publish "8080:${PORT}" \
            --env-file "${CONFIG}" \
            --env APP_ENVIRONMENT=staging \
            --env "APP_RELEASE_VERSION=${TAG}" \
            "${REFERENCE}"

      - name: Run the automated checks
        env:
          REFERENCE: ${{ needs.build.outputs.reference }}
          COMMIT: ${{ needs.intake.outputs.commit }}
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_RELEASE: ${{ needs.intake.outputs.label }}
          UI_TEXT: ${{ inputs.ui-expected-text }}
          STAGE_TITLE: 4 · Staging deployment and automated checks
          OUT: ${{ runner.temp }}/gxp-staging
        run: |
          set -uo pipefail
          expected_release="${EXPECTED_RELEASE#v}"
          base="http://127.0.0.1:8080"
          mkdir -p "${OUT}"
          checks="[]"
          record() {
            checks=$(jq -c --arg c "$1" --arg r "$2" --arg d "$3" '. + [{check: $c, result: $r, detail: $d}]' <<<"${checks}")
          }
          for _ in $(seq 1 30); do curl -fsS "${base}/health" >/dev/null 2>&1 && break; sleep 2; done

          configured=$(docker inspect gxp-target --format '{{.Config.Image}}')
          running_id=$(docker inspect gxp-target --format '{{.Image}}')
          expected_id=$(docker image inspect "${REFERENCE}" --format '{{.Id}}')
          if [ "${configured}" = "${REFERENCE}" ] && [ "${running_id}" = "${expected_id}" ]; then
            record "Running container uses the built image digest" pass "${configured}"
          else
            record "Running container uses the built image digest" fail "configured ${configured}, image ${running_id}, expected ${expected_id}"
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' "${base}/health")
          if [ "${code}" = "200" ]; then record "Health endpoint responds" pass "HTTP ${code}"; else record "Health endpoint responds" fail "HTTP ${code}"; fi

          version_json=$(curl -fsS "${base}/version" 2>/dev/null || echo '{}')
          echo "${version_json}" > "${OUT}/version.json"
          for field in commit:"${COMMIT}" environment:"${EXPECTED_ENVIRONMENT}" release:"${expected_release}"; do
            key="${field%%:*}"; want="${field#*:}"
            got=$(jq -r --arg k "${key}" '.[$k] // "missing"' <<<"${version_json}")
            if [ "${got}" = "${want}" ]; then record "/version reports ${key}" pass "${got}"; else record "/version reports ${key}" fail "got ${got}, expected ${want}"; fi
          done

          if [ -n "${UI_TEXT}" ]; then
            curl -fsS "${base}/" -o "${OUT}/home.html" 2>/dev/null || true
            if grep -qF "${UI_TEXT}" "${OUT}/home.html" 2>/dev/null; then
              record "Home page shows expected text" pass "${UI_TEXT}"
            else
              record "Home page shows expected text" fail "'${UI_TEXT}' not found"
            fi
          fi

          docker logs gxp-target > "${OUT}/container.log" 2>&1 || true
          failed=$(jq '[.[] | select(.result != "pass")] | length' <<<"${checks}")
          result=$([ "${failed}" -eq 0 ] && echo pass || echo fail)
          jq -n --arg environment "${EXPECTED_ENVIRONMENT}" --arg reference "${REFERENCE}" --arg result "${result}" \
                --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson checks "${checks}" \
            '{environment: $environment, reference: $reference, result: $result, checked_at: $checked_at, checks: $checks}' \
            > "${OUT}/checks.json"
          {
            echo "## ${STAGE_TITLE}"
            echo "Target: \`${REFERENCE}\`"
            echo
            echo "| Check | Result | Detail |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.check) | \(if .result == "pass" then "✅ pass" else "❌ fail" end) | \(.detail) |"' <<<"${checks}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} automated check(s) failed."
            exit 1
          fi

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-staging
          path: ${{ runner.temp }}/gxp-staging
          if-no-files-found: ignore

      # STAGING holds one candidate at a time. Older release runs still waiting at a gate can no
      # longer be verified, so they are cancelled.
      - name: Cancel superseded release runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.intake.outputs.label }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const waiting = await github.paginate(github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: run.workflow_id, status: 'waiting', per_page: 100 });
            const superseded = waiting.filter((r) => r.id !== run.id);
            for (const r of superseded) {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: r.id });
              core.notice(`Cancelled "${r.display_title}" (run ${r.id}): superseded by ${process.env.TAG} on staging.`);
            }
            if (superseded.length) {
              await core.summary.addRaw(`Superseded and cancelled: ${superseded.map((r) => `<a href="${r.html_url}">${r.display_title}</a>`).join(', ')}`, true).write();
            }

  evidence:
    name: 5 · Evidence pack
    needs: [intake, build, staging]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.commit }}
          persist-credentials: false

      - name: Collect the evidence of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gxp-*
          path: ${{ runner.temp }}/evidence

      - name: Assemble the release candidate record
        env:
          EVIDENCE: ${{ runner.temp }}/evidence
          VERSION: ${{ needs.intake.outputs.version }}
          TAG: ${{ needs.intake.outputs.label }}
          COMMIT: ${{ needs.intake.outputs.commit }}
          STAGING_CONFIG: ${{ inputs.staging-config }}
          PRODUCTION_CONFIG: ${{ inputs.production-config }}
        run: |
          set -euo pipefail
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          for f in "${STAGING_CONFIG}" "${PRODUCTION_CONFIG}"; do
            [ -f "${f}" ] || { echo "::error::Configuration file ${f} is missing."; exit 1; }
          done
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" --arg repo_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg version "${VERSION}" --arg label "${TAG}" --arg commit "${COMMIT}" --arg merged_by "${GITHUB_ACTOR}" \
            --slurpfile framework "${EVIDENCE}/gxp-intake/framework.json" \
            --slurpfile candidate "${EVIDENCE}/gxp-intake/candidate.json" \
            --slurpfile scope "${EVIDENCE}/gxp-intake/change-requests.json" \
            --slurpfile build "${EVIDENCE}/gxp-build/build.json" \
            --slurpfile unit "${EVIDENCE}/gxp-unit-tests/unit-tests.json" \
            --slurpfile staging "${EVIDENCE}/gxp-staging/checks.json" \
            --arg staging_config "${STAGING_CONFIG}" --arg staging_sha "$(sha "${STAGING_CONFIG}")" \
            --arg production_config "${PRODUCTION_CONFIG}" --arg production_sha "$(sha "${PRODUCTION_CONFIG}")" \
            --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" --arg run_url "${run_url}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: "gxp-release-candidate/v2",
              application: {repository: $repository, url: $repo_url},
              release: {version: $version, candidate: $label, commit: $commit, previous_release: $scope[0].base_tag,
                        bump: $scope[0].bump, stage_branch: $candidate[0].stage_branch,
                        production_branch: $candidate[0].production_branch, merged_to_stage_by: $merged_by},
              framework: $framework[0],
              artifact: ($build[0] | {image, digest, reference, tags, build_id, built_at}),
              impact_assessment: ($scope[0] | {gxp_impact, validation_path, impacted_requirements, change_control_ids, change_requests}),
              pull_requests: $scope[0].pull_requests,
              code_authors: $scope[0].code_authors,
              configuration: {
                staging: {path: $staging_config, sha256: $staging_sha},
                production: {path: $production_config, sha256: $production_sha}
              },
              automated_verification: {
                unit_tests: ($unit[0] | {result, total, passed, failed, skipped, traceability}),
                staging_checks: ($staging[0] | {result, checked_at, checks})
              },
              candidate_run: {id: ($run_id | tonumber), attempt: ($run_attempt | tonumber), url: $run_url},
              evidence_artifact: "gxp-evidence-\($label)",
              created_at: $created_at
            }' > "${EVIDENCE}/release-candidate.json"

          cd "${EVIDENCE}"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/SHA256SUMS"
          mv "${RUNNER_TEMP}/SHA256SUMS" SHA256SUMS
          {
            echo "## 5 · Evidence pack"
            echo "Artifact \`gxp-evidence-${TAG}\` with $(wc -l < SHA256SUMS) files, each listed with its SHA-256 in \`SHA256SUMS\`."
            echo
            echo '```json'
            jq '{release, artifact: .artifact | {digest, reference}, impact_assessment: .impact_assessment | {gxp_impact, validation_path, impacted_requirements}, change_requests: [.impact_assessment.change_requests[] | "#\(.number) \(.title)"]}' release-candidate.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the evidence pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-evidence-${{ needs.intake.outputs.label }}
          path: ${{ runner.temp }}/evidence
          retention-days: 90
          if-no-files-found: error

  verification:
    name: 6 · Verification
    needs: [intake, evidence]
    runs-on: ubuntu-24.04
    # The run waits here until a reviewer of this environment approves. The reviewer verifies the
    # candidate on staging first and approves with a comment "PASS <verification record reference>".
    environment: gxp-verification
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      verifier: ${{ steps.check.outputs.verifier }}
    steps:
      - name: Read the roles from the production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.production-branch }}
          sparse-checkout: .gxp
          persist-credentials: false

      - name: Check the verification approval
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT: ${{ needs.intake.outputs.commit }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const env = 'gxp-verification';
            const commit = process.env.COMMIT;
            const problems = [];
            const { stdout } = await exec.getExecOutput('bash', ['-c', "yq -o=json '.' .gxp/roles.yml"], { silent: true });
            const roles = JSON.parse(stdout.trim() || 'null') ?? {};

            const { data: reviews } = await github.rest.actions.getReviewsForRun({ owner, repo, run_id: context.runId });
            // GitHub lists reviews newest first; after "Re-run failed jobs" the newest one counts.
            const gateReviews = reviews.filter((r) => r.environments.some((e) => e.name === env));
            const review = gateReviews[0];
            if (!review) {
              core.setFailed(`No review was recorded for ${env}. Give the environment required reviewers (Settings → Environments → ${env}) so the run waits for verification.`);
              return;
            }
            const verifier = review.user.login;
            const comment = (review.comment ?? '').trim();
            const match = comment.match(/^PASS\b[\s:\u2013-]*(.*)$/is);
            if (review.state !== 'approved') problems.push(`the review was ${review.state}`);
            if (!(roles.verifiers ?? []).includes(verifier)) problems.push(`${verifier} is not a verifier in .gxp/roles.yml`);
            if (!match || !match[1].trim()) problems.push(`the approval comment must be "PASS" followed by the verification record reference (got "${comment || 'no comment'}")`);

            // STAGING holds one candidate at a time; a newer candidate supersedes this one.
            const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, environment: 'gxp-staging', per_page: 1 });
            const onStaging = deployments[0]?.sha ?? 'nothing';
            if (onStaging !== commit) problems.push(`staging now runs ${onStaging.slice(0, 12)}, so this candidate (${commit.slice(0, 12)}) is superseded`);

            const result = { environment: env, verifier, state: review.state, comment,
                             reference: match ? match[1].trim() : null, checked_at: new Date().toISOString(),
                             reviews_recorded: gateReviews.length, problems };
            fs.mkdirSync(`${process.env.RUNNER_TEMP}/gxp-verification`, { recursive: true });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/gxp-verification/verification.json`, JSON.stringify(result, null, 2));
            core.setOutput('verifier', verifier);

            const summary = core.summary.addHeading('6 · Verification', 2).addTable([
              [{ data: 'Item', header: true }, { data: 'Value', header: true }],
              ['Verified by', `@${verifier}`],
              ['Result and reference', comment || '(no comment)'],
              ['Commit on staging', `<code>${onStaging}</code>`],
              ['Reviews recorded for this gate', `${gateReviews.length} (the newest counts)`],
            ]);
            if (problems.length) summary.addList(problems.map((p) => `❌ ${p}`));
            await summary.write();
            if (problems.length) core.setFailed(problems.join('; '));

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-verification
          path: ${{ runner.temp }}/gxp-verification
          if-no-files-found: ignore

  promote:
    name: 7 · Promote to production
    needs: [intake, build, verification]
    runs-on: ubuntu-24.04
    # The run waits here until a release approver of this environment approves the release.
    environment: gxp-production
    permissions:
      contents: read
      packages: write
      actions: read
      deployments: read
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.commit }}
          persist-credentials: false

      - name: Read the roles from the production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.production-branch }}
          sparse-checkout: .gxp
          path: gxp-roles
          persist-credentials: false

      - name: Check the production approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT: ${{ needs.intake.outputs.commit }}
          CODE_AUTHORS: ${{ needs.intake.outputs.code-authors }}
          VERIFIER: ${{ needs.verification.outputs.verifier }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const env = 'gxp-production';
            const commit = process.env.COMMIT;
            const codeAuthors = JSON.parse(process.env.CODE_AUTHORS || '[]');
            const problems = [];
            const { stdout } = await exec.getExecOutput('bash', ['-c', "yq -o=json '.' gxp-roles/.gxp/roles.yml"], { silent: true });
            const roles = JSON.parse(stdout.trim() || 'null') ?? {};

            const { data: reviews } = await github.rest.actions.getReviewsForRun({ owner, repo, run_id: context.runId });
            // GitHub lists reviews newest first; after "Re-run failed jobs" the newest one counts.
            const gateReviews = reviews.filter((r) => r.environments.some((e) => e.name === env));
            const review = gateReviews[0];
            if (!review) {
              core.setFailed(`No review was recorded for ${env}. Give the environment required reviewers (Settings → Environments → ${env}) so the run waits for approval.`);
              return;
            }
            const approver = review.user.login;
            if (review.state !== 'approved') problems.push(`the review was ${review.state}`);
            if (!(roles.release_approvers ?? []).includes(approver)) problems.push(`${approver} is not a release approver in .gxp/roles.yml`);
            if (codeAuthors.includes(approver)) problems.push(`${approver} wrote code in this release and cannot approve it`);
            if (approver === process.env.VERIFIER) problems.push(`${approver} verified this release and cannot also approve it`);

            const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, environment: 'gxp-staging', per_page: 1 });
            const onStaging = deployments[0]?.sha ?? 'nothing';
            if (onStaging !== commit) problems.push(`staging now runs ${onStaging.slice(0, 12)}, so this candidate (${commit.slice(0, 12)}) is superseded`);

            const result = { environment: env, approver, state: review.state, comment: review.comment ?? '',
                             approved_before: new Date().toISOString(), reviews_recorded: gateReviews.length, problems };
            fs.mkdirSync(`${process.env.RUNNER_TEMP}/gxp-production`, { recursive: true });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/gxp-production/approval.json`, JSON.stringify(result, null, 2));

            const summary = core.summary.addHeading('7 · Production approval', 2).addTable([
              [{ data: 'Item', header: true }, { data: 'Value', header: true }],
              ['Approved by', `@${approver}`],
              ['Comment', review.comment || '(none)'],
              ['Code authors / verifier', `${codeAuthors.map((a) => '@' + a).join(', ') || '-'} / @${process.env.VERIFIER}`],
              ['Reviews recorded for this gate', `${gateReviews.length} (the newest counts)`],
            ]);
            if (problems.length) summary.addList(problems.map((p) => `❌ ${p}`));
            await summary.write();
            if (problems.length) core.setFailed(problems.join('; '));

      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
        run: echo "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Check that the registry still holds the approved image
        env:
          IMAGE: ${{ needs.intake.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          actual="sha256:$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}" | sha256sum | cut -d' ' -f1)"
          if [ "${actual}" != "${DIGEST}" ]; then
            echo "::error::The registry returned ${actual} for ${DIGEST}."
            exit 1
          fi

      # v0.1: PRODUCTION is simulated by running the image on the runner. From v0.3 this step
      # deploys the same digest to Azure Container Apps.
      - name: Deploy the approved image to simulated production
        env:
          REFERENCE: ${{ needs.build.outputs.reference }}
          CONFIG: ${{ inputs.production-config }}
          PORT: ${{ inputs.container-port }}
          VERSION: ${{ needs.intake.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --quiet "${REFERENCE}"
          docker run --detach --name gxp-target --publish "8080:${PORT}" \
            --env-file "${CONFIG}" \
            --env APP_ENVIRONMENT=production \
            --env "APP_RELEASE_VERSION=${VERSION}" \
            "${REFERENCE}"

      - name: Run the production checks
        env:
          REFERENCE: ${{ needs.build.outputs.reference }}
          COMMIT: ${{ needs.intake.outputs.commit }}
          EXPECTED_ENVIRONMENT: production
          EXPECTED_RELEASE: ${{ needs.intake.outputs.version }}
          UI_TEXT: ${{ inputs.ui-expected-text }}
          STAGE_TITLE: 7 · Production deployment checks
          OUT: ${{ runner.temp }}/gxp-production
        run: |
          set -uo pipefail
          expected_release="${EXPECTED_RELEASE#v}"
          base="http://127.0.0.1:8080"
          mkdir -p "${OUT}"
          checks="[]"
          record() {
            checks=$(jq -c --arg c "$1" --arg r "$2" --arg d "$3" '. + [{check: $c, result: $r, detail: $d}]' <<<"${checks}")
          }
          for _ in $(seq 1 30); do curl -fsS "${base}/health" >/dev/null 2>&1 && break; sleep 2; done

          configured=$(docker inspect gxp-target --format '{{.Config.Image}}')
          running_id=$(docker inspect gxp-target --format '{{.Image}}')
          expected_id=$(docker image inspect "${REFERENCE}" --format '{{.Id}}')
          if [ "${configured}" = "${REFERENCE}" ] && [ "${running_id}" = "${expected_id}" ]; then
            record "Running container uses the approved image digest" pass "${configured}"
          else
            record "Running container uses the approved image digest" fail "configured ${configured}, image ${running_id}, expected ${expected_id}"
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' "${base}/health")
          if [ "${code}" = "200" ]; then record "Health endpoint responds" pass "HTTP ${code}"; else record "Health endpoint responds" fail "HTTP ${code}"; fi

          version_json=$(curl -fsS "${base}/version" 2>/dev/null || echo '{}')
          echo "${version_json}" > "${OUT}/version.json"
          for field in commit:"${COMMIT}" environment:"${EXPECTED_ENVIRONMENT}" release:"${expected_release}"; do
            key="${field%%:*}"; want="${field#*:}"
            got=$(jq -r --arg k "${key}" '.[$k] // "missing"' <<<"${version_json}")
            if [ "${got}" = "${want}" ]; then record "/version reports ${key}" pass "${got}"; else record "/version reports ${key}" fail "got ${got}, expected ${want}"; fi
          done

          if [ -n "${UI_TEXT}" ]; then
            curl -fsS "${base}/" -o "${OUT}/home.html" 2>/dev/null || true
            if grep -qF "${UI_TEXT}" "${OUT}/home.html" 2>/dev/null; then
              record "Home page shows expected text" pass "${UI_TEXT}"
            else
              record "Home page shows expected text" fail "'${UI_TEXT}' not found"
            fi
          fi

          docker logs gxp-target > "${OUT}/container.log" 2>&1 || true
          failed=$(jq '[.[] | select(.result != "pass")] | length' <<<"${checks}")
          result=$([ "${failed}" -eq 0 ] && echo pass || echo fail)
          jq -n --arg environment "${EXPECTED_ENVIRONMENT}" --arg reference "${REFERENCE}" --arg result "${result}" \
                --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson checks "${checks}" \
            '{environment: $environment, reference: $reference, result: $result, checked_at: $checked_at, checks: $checks}' \
            > "${OUT}/checks.json"
          {
            echo "## ${STAGE_TITLE}"
            echo "Target: \`${REFERENCE}\`"
            echo
            echo "| Check | Result | Detail |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.check) | \(if .result == "pass" then "✅ pass" else "❌ fail" end) | \(.detail) |"' <<<"${checks}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${failed}" -ne 0 ]; then
            echo "::error::${failed} production check(s) failed."
            exit 1
          fi

      - name: Tag the approved image with the release version
        env:
          IMAGE: ${{ needs.intake.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.intake.outputs.version }}
        run: |
          set -euo pipefail
          # Adds a tag to the existing manifest. Nothing is rebuilt and the digest must not change.
          skopeo copy --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${VERSION}"
          tagged="sha256:$(skopeo inspect --raw "docker://${IMAGE}:${VERSION}" | sha256sum | cut -d' ' -f1)"
          if [ "${tagged}" != "${DIGEST}" ]; then
            echo "::error::Tag ${VERSION} resolves to ${tagged}, not the approved ${DIGEST}."
            exit 1
          fi
          echo "Registry tag \`${IMAGE}:${VERSION}\` → \`${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-production
          path: ${{ runner.temp }}/gxp-production
          if-no-files-found: ignore

  record:
    name: 8 · Release
    needs: [intake, promote]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Collect the evidence of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gxp-*
          path: ${{ runner.temp }}/release

      - name: Assemble the release record
        env:
          DIR: ${{ runner.temp }}/release
          VERSION: ${{ needs.intake.outputs.version }}
          TAG: ${{ needs.intake.outputs.label }}
        run: |
          set -euo pipefail
          cd "${DIR}"
          pack="gxp-evidence-${TAG}"
          (cd "${pack}" && sha256sum --check --quiet SHA256SUMS)
          jq -n \
            --slurpfile candidate "${pack}/release-candidate.json" \
            --slurpfile verification gxp-verification/verification.json \
            --slurpfile approval gxp-production/approval.json \
            --slurpfile production gxp-production/checks.json \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg version "${VERSION}" \
            '($candidate[0] | del(.schema)) + {
              schema: "gxp-release-record/v2",
              status: "released",
              release_tag: "v\($version)",
              verification: ($verification[0] | {verifier, reference, comment}),
              production_approval: ($approval[0] | {approver, comment, approved_before}),
              production_checks: ($production[0] | {result, checked_at, checks}),
              released_at: $released_at
            }' > release-record.json

      - name: Collect the run timeline
        env:
          DIR: ${{ runner.temp }}/release
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${DIR}/run-jobs.json"

      - name: Generate the release report page
        env:
          DIR: ${{ runner.temp }}/release
          PACK: gxp-evidence-${{ needs.intake.outputs.label }}
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re
          from datetime import datetime, timezone

          d = os.environ["DIR"]
          pack = os.path.join(d, os.environ["PACK"])

          def load(path, default=None):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return json.load(fh)
              except (OSError, ValueError):
                  return default

          rec = load(os.path.join(d, "release-record.json"))
          jobs = (load(os.path.join(d, "run-jobs.json"), {}) or {}).get("jobs", [])
          unit = load(os.path.join(pack, "gxp-unit-tests", "unit-tests.json"), {}) or {}
          with open(os.path.join(pack, "SHA256SUMS"), encoding="utf-8") as fh:
              sums = [line.rstrip("\n").split("  ", 1) for line in fh if line.strip()]
          with open(os.path.join(d, "release-record.json"), "rb") as fh:
              record_sha = hashlib.sha256(fh.read()).hexdigest()

          def e(v):
              return html.escape("" if v is None else str(v))
          def code(v):
              return f"<code>{e(v)}</code>"
          def link(url, text):
              return f'<a href="{e(url)}">{e(text)}</a>'
          def when(v):
              return e(v.replace("T", " ").replace("Z", " UTC")) if v else ""
          def verdict(v):
              ok = v in ("pass", "passed", "success", "approved", "released")
              return f'<span class="{"ok" if ok else "bad"}">{e(v)}</span>'
          def kv(rows):
              return '<table class="kv">' + "".join(f"<tr><th>{e(k)}</th><td>{v}</td></tr>" for k, v in rows) + "</table>"
          def grid(headers, rows):
              head = "".join(f"<th>{e(h)}</th>" for h in headers)
              body = "".join("<tr>" + "".join(f"<td>{c}</td>" for c in row) + "</tr>" for row in rows)
              return f"<table><thead><tr>{head}</tr></thead><tbody>{body}</tbody></table>"

          app, rel, fw, art = rec["application"], rec["release"], rec["framework"], rec["artifact"]
          ia, av = rec["impact_assessment"], rec["automated_verification"]

          def stage_number(job):
              m = re.match(r"(\d+)", job["name"].split(" / ")[-1])
              return int(m.group(1)) if m else 99
          jobs = sorted(jobs, key=stage_number)
          def job_start(number):
              return next((j.get("started_at") for j in jobs if stage_number(j) == number), None)
          stage_rows = [[e(j["name"].split(" / ")[-1]),
                         verdict(j.get("conclusion") or "in progress (this job)"),
                         when(j.get("started_at")), when(j.get("completed_at"))] for j in jobs]

          crs, prs = ia["change_requests"], rec["pull_requests"]
          people = []
          for cr in crs:
              people.append([f"Change request {link(cr['url'], '#' + str(cr['number']))} approved", e(cr["approved_by"]),
                             when(cr["approved_at"]), f"requested by {e(cr['requester'])}"])
          for pr in prs:
              reviewers = pr["reviewed_by"]
              people.append([f"Code review of {link(pr['url'], 'PR #' + str(pr['number']))}",
                             e(", ".join(r["login"] for r in reviewers)), when(reviewers[0]["submitted_at"]) if reviewers else "",
                             f"code by {e(', '.join(pr['code_authors']))}"])
          people += [
              ["Merged to stage (candidate started)", e(rel["merged_to_stage_by"]), when(job_start(1)), code(rel["candidate"])],
              ["Verified on staging", e(rec["verification"]["verifier"]), when(job_start(6)), e(rec["verification"]["comment"])],
              ["Approved for production", e(rec["production_approval"]["approver"]), when(job_start(7)),
               e(rec["production_approval"]["comment"] or "")],
          ]
          cr_table = grid(["Change request", "Type", "Impact / path", "Requirements", "Reason"],
                          [[link(cr["url"], f"#{cr['number']} {cr['title']}"), e(cr["type"]), f"{e(cr['impact'])} / {e(cr['path'])}",
                            e(", ".join(cr["requirements"])), e(cr["reason"])] for cr in crs])
          pr_table = grid(["Pull request", "Author", "Merged by", "Merged"],
                          [[link(pr["url"], f"#{pr['number']} {pr['title']}"), e(pr["author"]), e(pr["merged_by"]), when(pr["merged_at"])]
                           for pr in prs])
          cc_ids = ", ".join(ia.get("change_control_ids") or [])
          cc_note = (f"the formal approval is recorded in the eQMS under change control {e(cc_ids)}" if cc_ids
                     else "where a formal approval is required, it is recorded in the eQMS")

          banner = ('<p class="banner">Framework pre-release: this release is not suitable for GxP use.</p>'
                    if fw.get("prerelease") else "")
          ut = av["unit_tests"]
          trace_rows = [[e(r), e(t["tests"]), e(t["passed"]), e(t["failed"]), e(t.get("skipped", 0))]
                        for r, t in sorted(ut.get("traceability", {}).items())]
          test_rows = [[e(t["name"]), e(", ".join(t["requirements"]) or "-"), verdict(t["status"])] for t in unit.get("tests", [])]
          def check_rows(checks):
              return [[e(c["check"]), verdict(c["result"]), code(c["detail"])] for c in checks]
          cfg = rec["configuration"]

          page = f"""<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>GxP release report {e(app['repository'])} {e(rel['version'])}</title>
          <style>
            @page {{ size: A4; margin: 14mm 12mm; }}
            body {{ font-family: "DejaVu Sans", Arial, sans-serif; font-size: 9pt; color: #1f2328; line-height: 1.35; }}
            h1 {{ font-size: 16pt; margin: 0 0 1mm; }}
            h2 {{ font-size: 11pt; margin: 6mm 0 2mm; padding-bottom: 1mm; border-bottom: 1px solid #d0d7de; }}
            table {{ width: 100%; border-collapse: collapse; margin: 1mm 0 3mm; }}
            th, td {{ border: 1px solid #d0d7de; padding: 1.2mm 1.8mm; text-align: left; vertical-align: top; }}
            thead th, table.kv th {{ background: #f6f8fa; }}
            table.kv th {{ width: 30%; }}
            tr, .block {{ break-inside: avoid; }}
            h2 {{ break-after: avoid; }}
            code {{ font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 7.5pt; word-break: break-all; }}
            a {{ color: #0969da; }}
            .ok {{ color: #1a7f37; font-weight: bold; }} .bad {{ color: #cf222e; font-weight: bold; }}
            .meta {{ color: #59636e; margin: 0 0 3mm; }}
            .banner {{ border: 1px solid #d4a72c; background: #fff8c5; padding: 2mm 3mm; }}
            .note {{ color: #59636e; font-size: 8pt; margin-top: 6mm; }}
          </style></head><body>
          <h1>GxP release report: {e(app['repository'].split('/')[-1])} {e(rel['version'])}</h1>
          <p class="meta">Status {verdict(rec['status'])} &middot; released {when(rec['released_at'])} &middot;
            generated {when(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))} by the GxP DevOps framework {e(fw['version'])}</p>
          {banner}

          <h2>1. Release</h2>
          {kv([
              ("Application", link(app["url"], app["repository"])),
              ("Version", f"{e(rel['version'])} ({e(rel['bump'])} after {e(rel.get('previous_release') or 'no earlier release')})"),
              ("Release candidate", code(rel["candidate"])),
              ("Commit", code(rel["commit"])),
              ("Image", code(art["reference"])),
              ("Built", f"{when(art['built_at'])}, build {code(art['build_id'])}"),
              ("Framework", f"{e(fw['version'])} ({code(fw['workflow_sha'])})"),
              ("Release run", link(rec["candidate_run"]["url"], rec["candidate_run"]["url"])),
          ])}

          <h2>2. Change requests and impact</h2>
          {kv([
              ("GxP impact / validation path", f"{e(ia['gxp_impact'])} / {e(ia['validation_path'])} (highest of the change requests)"),
              ("Impacted requirements", e(", ".join(ia["impacted_requirements"]) or "none")),
              ("Change control", e(cc_ids or "none recorded")),
          ])}
          {cr_table}
          {pr_table}

          <h2>3. Decisions and responsibilities</h2>
          {grid(["Decision", "By", "Recorded", "Detail"], people)}

          <h2>4. Release stages</h2>
          {grid(["Stage", "Result", "Started", "Completed"], stage_rows)}

          <h2>5. Automated verification</h2>
          <p>Unit tests: {verdict(ut['result'])}, {e(ut['passed'])} of {e(ut['total'])} passed, {e(ut['failed'])} failed, {e(ut.get('skipped', 0))} skipped.</p>
          {grid(["Requirement", "Tests", "Passed", "Failed", "Skipped"], trace_rows)}
          {grid(["Unit test", "Requirements", "Result"], test_rows)}
          <div class="block"><p>Staging checks: {verdict(av['staging_checks']['result'])} at {when(av['staging_checks']['checked_at'])}</p>
          {grid(["Check", "Result", "Detail"], check_rows(av["staging_checks"]["checks"]))}</div>
          <div class="block"><p>Production checks: {verdict(rec['production_checks']['result'])} at {when(rec['production_checks']['checked_at'])}</p>
          {grid(["Check", "Result", "Detail"], check_rows(rec["production_checks"]["checks"]))}</div>

          <h2>6. Configuration</h2>
          {grid(["Environment", "File", "SHA-256"], [[e(k), code(v["path"]), code(v["sha256"])] for k, v in cfg.items()])}

          <h2>7. Evidence</h2>
          <p>Evidence pack {code(rec['evidence_artifact'])}. Every file was checked against these SHA-256 values before this report was written.</p>
          {grid(["File", "SHA-256"], [[code(p.removeprefix("./")), code(s)] for s, p in sums])}

          <p class="note">Generated from release-record.json (SHA-256 {code(record_sha)}), attached to the GitHub release
            {e(rec['release_tag'])}. This report is not an electronic signature; {cc_note}.</p>
          </body></html>
          """
          with open(os.path.join(d, "release-report.html"), "w", encoding="utf-8") as fh:
              fh.write(page)
          print("Wrote release-report.html")
          PY

      - name: Print the release report to PDF
        env:
          DIR: ${{ runner.temp }}/release
          VERSION: ${{ needs.intake.outputs.version }}
        run: |
          set -euo pipefail
          pdf="${DIR}/release-report-v${VERSION}.pdf"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="${pdf}" "file://${DIR}/release-report.html"
          test -s "${pdf}"
          echo "Wrote $(basename "${pdf}") ($(stat -c %s "${pdf}") bytes)"

      - name: Package the evidence
        env:
          DIR: ${{ runner.temp }}/release
          VERSION: ${{ needs.intake.outputs.version }}
          TAG: ${{ needs.intake.outputs.label }}
        run: |
          set -euo pipefail
          cd "${DIR}"
          zip -qr "evidence-v${VERSION}.zip" "gxp-evidence-${TAG}" gxp-verification gxp-production \
            release-record.json run-jobs.json release-report.html
          sha256sum release-record.json "release-report-v${VERSION}.pdf" "evidence-v${VERSION}.zip" > SHA256SUMS

      - name: Publish the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIR: ${{ runner.temp }}/release
          VERSION: ${{ needs.intake.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const dir = process.env.DIR;
            const version = process.env.VERSION;
            const rec = JSON.parse(fs.readFileSync(path.join(dir, 'release-record.json'), 'utf8'));
            const tag = rec.release_tag;
            const commit = rec.release.commit;
            const production = rec.release.production_branch;
            const crs = rec.impact_assessment.change_requests;

            // 1. The production branch now holds exactly the validated commit. Fast-forward only.
            try {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${production}`, sha: commit, force: false });
            } catch (error) {
              const { data: current } = await github.rest.git.getRef({ owner, repo, ref: `heads/${production}` });
              if (current.object.sha !== commit) throw new Error(`Could not move ${production} to ${commit} (${error.message}). It points to ${current.object.sha}.`);
            }

            // 2. The version tag on the same commit.
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: commit });
            } catch (error) {
              const { data: existing } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existing.object.sha !== commit) throw new Error(`${tag} already exists and points to ${existing.object.sha}`);
            }

            // 3. The GitHub release with the report, the record and the evidence.
            const ia = rec.impact_assessment;
            const body = [
              `GxP release **${rec.release.version}** (${rec.release.bump} after ${rec.release.previous_release ?? 'no earlier release'}), validated as candidate \`${rec.release.candidate}\`.`,
              '',
              '### Change requests',
              ...crs.map((cr) => `- #${cr.number} ${cr.title} (${cr.type}, impact ${cr.impact}) · approved by @${cr.approved_by}`),
              '',
              '| | |',
              '|---|---|',
              `| Commit | \`${commit}\` |`,
              `| Image | \`${rec.artifact.reference}\` |`,
              `| GxP impact / validation path | **${ia.gxp_impact}** / **${ia.validation_path}** · ${ia.impacted_requirements.join(', ') || 'no requirements'} |`,
              `| Code review | ${rec.pull_requests.map((p) => `#${p.number} by ${p.reviewed_by.map((r) => '@' + r.login).join(', ')}`).join('; ')} |`,
              `| Verified by | @${rec.verification.verifier} (${rec.verification.reference}) |`,
              `| Approved for production by | @${rec.production_approval.approver} |`,
              `| Framework | ${rec.framework.version}${rec.framework.prerelease ? ' (pre-release, not for GxP use)' : ''} |`,
              `| Release run | ${rec.candidate_run.url} |`,
              `| Released at | ${rec.released_at} |`,
              '',
              `Attached: \`release-report-v${version}.pdf\` (human-readable report), \`release-record.json\` (machine-readable record), \`evidence-v${version}.zip\` (all evidence). Their SHA-256 values are in \`SHA256SUMS\`.`,
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `${rec.release.version}`, body, make_latest: 'true',
            });
            let reportUrl = release.html_url;
            for (const name of [`release-report-v${version}.pdf`, 'release-record.json', `evidence-v${version}.zip`, 'SHA256SUMS']) {
              const data = fs.readFileSync(path.join(dir, name));
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              if (name.endsWith('.pdf')) reportUrl = asset.browser_download_url;
            }

            // 4. Close the change requests.
            for (const cr of crs) {
              await github.rest.issues.createComment({ owner, repo, issue_number: cr.number,
                body: `🚀 Released in [${rec.release.version}](${release.html_url}) at ${rec.released_at}. [Release report (PDF)](${reportUrl})` });
              await github.rest.issues.addLabels({ owner, repo, issue_number: cr.number, labels: ['cr:released'] });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: cr.number, name: 'cr:approved' }); } catch (error) { if (error.status !== 404) throw error; }
              await github.rest.issues.update({ owner, repo, issue_number: cr.number, state: 'closed', state_reason: 'completed' });
            }

            await core.summary
              .addHeading(`8 · Release ${rec.release.version}`, 2)
              .addRaw(`Moved <code>${production}</code> to <code>${commit.slice(0, 12)}</code>, tagged <code>${tag}</code> and published <a href="${release.html_url}">release ${rec.release.version}</a> with the <a href="${reportUrl}">PDF report</a>.`, true)
              .addRaw(`Production runs <code>${rec.artifact.reference}</code>, the image built and validated as <code>${rec.release.candidate}</code>.`, true)
              .addRaw(`Closed change requests: ${crs.map((cr) => `#${cr.number}`).join(', ')}.`, true)
              .write();

      - name: Upload the release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: gxp-release-record-v${{ needs.intake.outputs.version }}
          path: |
            ${{ runner.temp }}/release/release-record.json
            ${{ runner.temp }}/release/release-report-v${{ needs.intake.outputs.version }}.pdf
            ${{ runner.temp }}/release/SHA256SUMS
          retention-days: 90
