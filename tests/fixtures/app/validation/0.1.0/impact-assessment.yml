# GxP impact assessment for release 0.1.0.
# Merge this through a PR approved by an approver (see .gxp/roles.yml) BEFORE tagging
# v0.1.0-rc.1. The framework refuses to build a release candidate without it.
schema: gxp-impact-assessment/v1
version: "0.1.0"

# Reference to the change record in the eQMS (Dot Compliance). Demo value.
change_control_id: CC-DEMO-0001

summary: >
  First release of the demo application: evaluation of a measured result against
  specification limits (PASS/OOS) and display of the running release and environment.

# new-system | feature | fix | cosmetic | configuration | infrastructure
change_type: new-system

# none | low | medium | high
gxp_impact: high

# abbreviated | targeted | full   (high requires full, medium requires targeted or full)
validation_path: full

# Requirement IDs from docs/requirements.md affected by this change.
impacted_requirements:
  - URS-001
  - URS-002
  - URS-003
  - URS-004

rationale: >
  Initial release of a system that classifies results against specifications, which is a
  GxP-relevant decision. All requirements are new, so the full validation path applies.

assessed_by: kristiyan-m-adv
